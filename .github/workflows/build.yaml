name: Build and optionally publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (select a release tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Verify release tag before publishing
        if: inputs.publish
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          import os
          from importlib.metadata import version
          from packaging.version import Version

          release = Version(version("fatqat"))
          assert os.environ["REF_TYPE"] == "tag", "Select a release tag to publish"
          assert os.environ["RELEASE_TAG"] == f"v{release}", "Tag and package version differ"
          assert not release.is_devrelease and release.local is None, "Not a release version"
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish && github.repository == 'spaceqat/fatqat'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
